# Для ручного запуска: alembic -x ... ; в коде миграции идут через python -m habit_bot.ops migrate
[alembic]
script_location = habit_bot/migrations
sqlalchemy.url = sqlite:///data/bot.db

[loggers]
keys = root

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[handler_console]
class = StreamHandler
args = (sys.stderr,)
formatter = generic

[formatter_generic]
format = %(levelname)s %(name)s %(message)s
